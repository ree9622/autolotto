name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.5.0)'
        required: false
        default: 'v1.7.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Restoring persistent release keystore from secrets..."
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            printf "storeFile=../release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "${STORE_PASS:-autolottopass}" "${KEY_ALIAS:-autolotto}" "${KEY_PASS:-autolottopass}" > key.properties
          else
            echo "Fallback: Generating ephemeral keystore..."
            keytool -genkeypair -v -keystore release.keystore -alias autolotto -keyalg RSA -keysize 2048 -validity 10000 -storepass autolottopass -keypass autolottopass -dname "CN=AutoLotto, OU=AutoLotto, O=UmiCorp, L=Seoul, ST=Seoul, C=KR"
            printf "storeFile=../release.keystore\nstorePassword=autolottopass\nkeyAlias=autolotto\nkeyPassword=autolottopass\n" > key.properties
          fi

      - name: Determine Tag and Version
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v1.3.0"
          fi
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "APK_NAME=autolotto-${VERSION}-universal.apk" >> $GITHUB_ENV

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: autolotto-${{ env.VERSION }}-universal
          path: ${{ env.APK_NAME }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing release or tag if present
          gh release delete "$TAG" -y || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          gh release create "$TAG" "$APK_NAME" \
            --title "$TAG — 로또·연금복권 화면 전환과 연금 내역 강화" \
            --notes "### 로또와 연금복권을 위쪽에서 전환
          - **복권 전환**: 화면 위쪽에서 로또 6/45와 연금복권720+를 고르면 홈·번호·내역이 그 복권 화면으로 바뀝니다
          - **하단 탭 정리**: 연금 탭을 없애고 홈·번호·내역·설정 4개로 돌아갔습니다
          - **연금 화면 분리**: 연금복권도 로또처럼 홈·번호·내역으로 나눴습니다
          - **마지막 선택 유지**: 앱을 다시 켜도 마지막에 고른 복권이 열립니다
          - **알림 이동**: 로또 알림은 로또 내역으로, 연금 알림은 연금 내역으로 바로 갑니다

          ### 연금 내역 강화
          - **통계**: 총 구매액, 일시금 당첨금, 손익, 연금식 당첨 건수를 보여 줍니다
          - **거르기**: 전체, 당첨, 추첨 전 회차만 골라 볼 수 있습니다
          - **최근 1년 불러오기**: 진행 상황을 보면서 1년 치 내역을 한 번에 불러옵니다
          - **회차 카드**: 그 회차 당첨번호와 내 번호, 등수와 당첨금을 함께 보여 줍니다
          - **넓은 화면**: 폴드 펼침과 태블릿에서는 통계와 목록을 2단으로 보여 줍니다

          ### 설치 파일
          - \`$APK_NAME\`: 모든 Android 12+ 기기 지원 단일 설치 파일"

