name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.3.0)'
        required: false
        default: 'v1.3.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Restoring persistent release keystore from secrets..."
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            printf "storeFile=../release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "${STORE_PASS:-autolottopass}" "${KEY_ALIAS:-autolotto}" "${KEY_PASS:-autolottopass}" > key.properties
          else
            echo "Fallback: Generating ephemeral keystore..."
            keytool -genkeypair -v -keystore release.keystore -alias autolotto -keyalg RSA -keysize 2048 -validity 10000 -storepass autolottopass -keypass autolottopass -dname "CN=AutoLotto, OU=AutoLotto, O=UmiCorp, L=Seoul, ST=Seoul, C=KR"
            printf "storeFile=../release.keystore\nstorePassword=autolottopass\nkeyAlias=autolotto\nkeyPassword=autolottopass\n" > key.properties
          fi

      - name: Determine Tag and Version
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v1.3.0"
          fi
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "APK_NAME=autolotto-${VERSION}-universal.apk" >> $GITHUB_ENV

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: autolotto-${{ env.VERSION }}-universal
          path: ${{ env.APK_NAME }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing release or tag if present
          gh release delete "$TAG" -y || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          gh release create "$TAG" "$APK_NAME" \
            --title "$TAG — 구매 내역 전체 조회·통계 & 폴더블 대화면 대응" \
            --notes "## 🎰 로또루틴 (LottoRoutine) $TAG 릴리스

          ### ✨ 새로운 기능 및 개선 사항
          - **구매 내역 전체 조회**: 과거 구매한 모든 복권 내역을 한눈에 조회 및 회차별 상세 결과 확인
          - **실시간 금액 통계**: 총 구매 금액, 당첨 금액, 순수익 및 당첨/낙첨 필터링 요약 통계 제공
          - **폴더블(Galaxy Fold) 및 태블릿 대응**: 대화면 및 화면 접힘 상태에 최적화된 반응형 2열 분할 레이아웃 적용
          - **영구 서명 키스토어 적용**: 릴리스 서명 인증서 고정으로 향후 인앱 자동 업데이트의 완벽한 연속성 보장

          ### 📱 설치 파일
          - \`$APK_NAME\`: 모든 Android 12+ 기기 지원 단일 설치 파일"

