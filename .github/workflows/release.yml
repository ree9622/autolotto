name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.5.0)'
        required: false
        default: 'v1.5.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Restoring persistent release keystore from secrets..."
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            printf "storeFile=../release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "${STORE_PASS:-autolottopass}" "${KEY_ALIAS:-autolotto}" "${KEY_PASS:-autolottopass}" > key.properties
          else
            echo "Fallback: Generating ephemeral keystore..."
            keytool -genkeypair -v -keystore release.keystore -alias autolotto -keyalg RSA -keysize 2048 -validity 10000 -storepass autolottopass -keypass autolottopass -dname "CN=AutoLotto, OU=AutoLotto, O=UmiCorp, L=Seoul, ST=Seoul, C=KR"
            printf "storeFile=../release.keystore\nstorePassword=autolottopass\nkeyAlias=autolotto\nkeyPassword=autolottopass\n" > key.properties
          fi

      - name: Determine Tag and Version
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v1.3.0"
          fi
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "APK_NAME=autolotto-${VERSION}-universal.apk" >> $GITHUB_ENV

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: autolotto-${{ env.VERSION }}-universal
          path: ${{ env.APK_NAME }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing release or tag if present
          gh release delete "$TAG" -y || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          gh release create "$TAG" "$APK_NAME" \
            --title "$TAG — 복권 번호표 비주얼 시스템 & 홈 결과 우선 배치·접근성 강화" \
            --notes "## 🎰 로또루틴 (LottoRoutine) $TAG 릴리스

          ### ✨ 새로운 기능 및 개선 사항
          - **복권 번호표 중심 비주얼 디자인 체계**: 실물 복권 용지 감성의 정돈된 티켓 스타일 카드 및 타이포그래피 전면 적용
          - **홈 화면 결과 우선 배치**: 앱 실행 시 직전 회차 당첨 번호와 내 결과 확인을 최상단에서 직관적으로 파악 가능
          - **시작 화면 및 다크 테마 접근성 강화**: 다크 모드에서의 텍스트·공 색상 대비 향상 및 첫 구동 시 부드러운 스플래시 전환
          - **예치금 네이티브 충전 & 케이뱅크 가상계좌 실시간 발급**: 앱 내에서 즉시 가상계좌 발급 및 토스/카카오뱅크 원터치 송금 지원
          - **구매 내역 1년 아카이브 & 갤럭시 Z 폴드 레이아웃 최적화**: 대화면 분할 뷰 및 장기 구매 내역 집계 지원

          ### 📱 설치 파일
          - \`$APK_NAME\`: 모든 Android 12+ 기기 지원 단일 설치 파일"

