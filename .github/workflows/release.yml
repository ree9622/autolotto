name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.4.0)'
        required: false
        default: 'v1.4.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Restoring persistent release keystore from secrets..."
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            printf "storeFile=../release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "${STORE_PASS:-autolottopass}" "${KEY_ALIAS:-autolotto}" "${KEY_PASS:-autolottopass}" > key.properties
          else
            echo "Fallback: Generating ephemeral keystore..."
            keytool -genkeypair -v -keystore release.keystore -alias autolotto -keyalg RSA -keysize 2048 -validity 10000 -storepass autolottopass -keypass autolottopass -dname "CN=AutoLotto, OU=AutoLotto, O=UmiCorp, L=Seoul, ST=Seoul, C=KR"
            printf "storeFile=../release.keystore\nstorePassword=autolottopass\nkeyAlias=autolotto\nkeyPassword=autolottopass\n" > key.properties
          fi

      - name: Determine Tag and Version
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v1.3.0"
          fi
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "APK_NAME=autolotto-${VERSION}-universal.apk" >> $GITHUB_ENV

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: autolotto-${{ env.VERSION }}-universal
          path: ${{ env.APK_NAME }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing release or tag if present
          gh release delete "$TAG" -y || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          gh release create "$TAG" "$APK_NAME" \
            --title "$TAG — 예치금 네이티브 충전 & 케이뱅크 가상계좌 간편 발급" \
            --notes "## 🎰 로또루틴 (LottoRoutine) $TAG 릴리스

          ### ✨ 새로운 기능 및 개선 사항
          - **예치금 네이티브 충전 화면 신설**: 외부 브라우저 전환 없이 앱 안에서 즉시 예치금을 충전할 수 있는 네이티브 충전 화면 탑재
          - **케이뱅크 가상계좌 실시간 발급**: 5천원~10만원 프리셋 및 직접 입력 금액에 대해 동행복권 2단계 케이뱅크 전용 가상계좌 자동 발급
          - **간편 송금 앱 원클릭 연동**: 토스(\`supertoss://\`), 카카오뱅크, 케이뱅크 바로가기 및 클립보드 원터치 계좌 복사 지원
          - **실시간 잔액 동기화**: 입금 완료 후 버튼 한 번으로 최신 예치금 잔액을 즉시 확인할 수 있는 새로고침 연동
          - **구매 내역 통계 & 폴더블 대화면 최적화**: 이전 버전의 구매 내역 1년 아카이브 및 갤럭시 Z 폴드 반응형 레이아웃 통합

          ### 📱 설치 파일
          - \`$APK_NAME\`: 모든 Android 12+ 기기 지원 단일 설치 파일"

